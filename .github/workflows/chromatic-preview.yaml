name: Chromatic preview (temporary)

on:
  pull_request:
    branches:
      - development

jobs:
  chromatic_preview:
    name: Deploy "@jakubmazanec/ui" to Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0

      - name: Install packages
        run: npm ci

      - name: Build "@jakubmazanec/ui"
        run: npx turbo run build --no-daemon --filter=@jakubmazanec/ui

      - name: Deploy "@jakubmazanec/ui"
        run: |
          cd packages/ui
          npx chromatic --project-token="$CHROMATIC_TOKEN" --storybook-build-dir storybook-static --exit-zero-on-changes --no-interactive
        env:
          CHROMATIC_TOKEN: ${{ secrets.JAKUBMAZANEC_UI_CHROMATIC_TOKEN }}
